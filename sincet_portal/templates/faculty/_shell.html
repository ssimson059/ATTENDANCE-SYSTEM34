{% extends "base.html" %}
{% block body %}
<main class="main" style="max-width:1280px;margin:auto">
  <header class="top">
    <div class="brand"><div class="logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt=""></div>
      <div><b>{% block heading %}{% endblock %}</b><small>{{ me.dept_name }} · SINCET</small></div></div>
    <div class="who"><a class="btn ghost sm" href="{{ url_for('faculty_dashboard') }}">← Dashboard</a><a class="btn ghost sm" href="{{ logout_url() }}">Logout</a></div>
  </header>
  {% block content %}{% endblock %}
</main>
{% endblock %}
