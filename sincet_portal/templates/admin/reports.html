{% extends "admin/layout.html" %}
{% block title %}Reports – SINCET{% endblock %}
{% block heading %}📊 Reports &amp; Export{% endblock %}
{% block content %}
<div class="card glass rise d1">
  <div class="bar">
    <select class="inp" id="rep" style="max-width:260px">{% for k in allowed %}<option value="{{ k }}">{{ titles[k] }}</option>{% endfor %}</select>
    <select class="inp" id="dept" style="max-width:200px"><option value="">All departments</option>{% for d in depts %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select>
    <select class="inp" id="year" style="max-width:130px"><option value="">All years</option>{% for i in range(1,5) %}<option value="{{ i }}">Year {{ i }}</option>{% endfor %}</select>
    <input class="inp" id="thr" type="number" min="1" max="100" value="{{ default_threshold|int }}" title="Attendance below (%)" style="max-width:110px;display:none">
    <button class="btn" id="go">Show</button>
    <a class="btn ghost sm" id="xl">⬇ Excel</a><a class="btn ghost sm" id="pf">⬇ PDF</a><a class="btn ghost sm" id="cs">⬇ CSV</a>
  </div>
  <div class="tw"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <p class="muted" id="count" style="margin:10px 2px 0"></p>
  <div class="bar" id="alertBar" style="margin-top:14px;display:none">
    <select class="inp" id="ch" style="max-width:160px"><option value="sms">SMS</option><option value="whatsapp">WhatsApp</option><option value="email">Email</option></select>
    <button class="btn danger" id="alert">📲 Alert parents of these students</button><span class="muted" id="msg"></span></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const NUM = new Set(['Billed', 'Received', 'Awaiting verification', 'Outstanding', 'Amount', 'Paid', 'Due']);
const qs = () => new URLSearchParams({ dept: $('#dept').value, year: $('#year').value, threshold: $('#thr').value }).toString();
function sync() { const r = $('#rep').value; $('#thr').style.display = r === 'low_attendance' ? '' : 'none'; $('#dept').style.display = $('#year').style.display = r === 'fee_summary' ? 'none' : '';
  $('#alertBar').style.display = r === 'fee_summary' ? 'none' : ''; $('#alert').textContent = r === 'low_attendance' ? '📲 Alert parents: low attendance' : '📲 Alert parents: fee pending'; }
async function load() { sync(); const r = $('#rep').value, d = await api(`/admin/api/reports/${r}?` + qs());
  $('#head').innerHTML = '<tr>' + d.header.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
  $('#body').innerHTML = d.rows.length ? d.rows.map(x => '<tr>' + x.map((c, i) => `<td>${NUM.has(d.header[i]) ? Number(c).toLocaleString('en-IN') : esc(c)}</td>`).join('') + '</tr>').join('') : `<tr><td colspan="${d.header.length}" class="empty">Nothing to report 🎉</td></tr>`;
  $('#count').textContent = d.rows.length + ' row(s)';
  ['xl', 'pf', 'cs'].forEach((id, i) => $('#' + id).href = `/admin/reports/export/${r}.${['xlsx', 'pdf', 'csv'][i]}?` + qs()); }
$('#go').onclick = $('#rep').onchange = () => load().catch(e => toast(e.message, 'err')); load().catch(e => toast(e.message, 'err'));
$('#alert').onclick = async () => { const body = { kind: $('#rep').value === 'low_attendance' ? 'low_attendance' : 'fee_pending', channel: $('#ch').value, dept: $('#dept').value, year: $('#year').value, threshold: $('#thr').value };
  try { const p = await api('/admin/api/reports/alert-parents', 'POST', { ...body, preview: true });
    if (!p.students) return toast('Nobody to alert', 'err');
    if (!confirm(`Send ${body.channel.toUpperCase()} to parents of ${p.with_contact} of ${p.students} students (others have no parent contact)?` + (p.configured ? '' : '\n\nThis channel is not configured yet - messages will only be logged (dry run).'))) return;
    const r = await api('/admin/api/reports/alert-parents', 'POST', body);
    $('#msg').textContent = `sent ${r.sent}, logged ${r.logged}, failed ${r.failed}, already alerted this week ${r.duplicate}, no contact ${r.no_contact}`; toast('Done'); } catch (e) { toast(e.message, 'err'); } };
</script>
{% endblock %}
